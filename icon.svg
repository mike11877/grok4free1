<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0a"/>

  <!-- Gradient Background Circle -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="220" fill="url(#grad)"/>

  <!-- Sudoku Grid -->
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <!-- Thin lines -->
    <line x1="160" y1="136" x2="160" y2="376" stroke-width="1.5"/>
    <line x1="200" y1="136" x2="200" y2="376" stroke-width="1.5"/>
    <line x1="240" y1="136" x2="240" y2="376" stroke-width="1.5"/>
    <line x1="280" y1="136" x2="280" y2="376" stroke-width="1.5"/>
    <line x1="320" y1="136" x2="320" y2="376" stroke-width="1.5"/>
    <line x1="360" y1="136" x2="360" y2="376" stroke-width="1.5"/>

    <line x1="120" y1="176" x2="400" y2="176" stroke-width="1.5"/>
    <line x1="120" y1="216" x2="400" y2="216" stroke-width="1.5"/>
    <line x1="120" y1="256" x2="400" y2="256" stroke-width="1.5"/>
    <line x1="120" y1="296" x2="400" y2="296" stroke-width="1.5"/>
    <line x1="120" y1="336" x2="400" y2="336" stroke-width="1.5"/>

    <!-- Thick lines for 3x3 boxes -->
    <rect x="120" y="136" width="280" height="240" stroke-width="4"/>
    <line x1="213.33" y1="136" x2="213.33" y2="376" stroke-width="4"/>
    <line x1="306.67" y1="136" x2="306.67" y2="376" stroke-width="4"/>
    <line x1="120" y1="216" x2="400" y2="216" stroke-width="4"/>
    <line x1="120" y1="296" x2="400" y2="296" stroke-width="4"/>
  </g>

  <!-- Sample numbers to show it's Sudoku -->
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle">
    <text x="140" y="166">5</text>
    <text x="260" y="166">3</text>
    <text x="340" y="206">7</text>
    <text x="180" y="246">6</text>
    <text x="300" y="246">9</text>
    <text x="380" y="246">2</text>
    <text x="220" y="326">8</text>
    <text x="260" y="366">1</text>
    <text x="380" y="366">4</text>
  </g>
</svg>
